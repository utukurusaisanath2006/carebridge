<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var resetKey = 'carebridge_theme_reset_dark_v3';
          if (!localStorage.getItem(resetKey)) {
            localStorage.setItem('carebridge_theme', 'dark');
            localStorage.setItem(resetKey, '1');
          }
          var t = localStorage.getItem('carebridge_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Care Bridge — Agentic Hospital Discharge Coordinator</title>
    <link rel="preload" href="/assets/carebridge-emblem-1024.webp" as="image" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
